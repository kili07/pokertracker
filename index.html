<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>Pokertracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── Laufende Session ───────────────────────────────────────── -->
<div id="liveBar" class="livebar hidden">
  <div class="livebar-info">
    <span class="livebar-dot"></span>
    <div>
      <div class="livebar-title" id="liveTitle">Cash Game</div>
      <div class="livebar-sub" id="liveSub">1/2 · Casino Wien</div>
    </div>
  </div>
  <div class="livebar-timer" id="liveTimer">00:00:00</div>
  <button class="btn btn-sm" id="liveOpen">Öffnen</button>
</div>

<header class="topbar">
  <h1 id="viewTitle">Übersicht</h1>
  <button class="icon-btn" id="btnSettings" aria-label="Einstellungen">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5m7.43-2.53a7.6 7.6 0 0 0 0-1.94l2.03-1.58a.5.5 0 0 0 .12-.62l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.3 7.3 0 0 0-1.68-.97l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.6.24-1.16.57-1.68.97l-2.39-.96a.5.5 0 0 0-.6.22L2.42 8.83a.5.5 0 0 0 .12.62l2.03 1.58a7.6 7.6 0 0 0 0 1.94l-2.03 1.58a.5.5 0 0 0-.12.62l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.52.4 1.08.73 1.68.97l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54c.6-.24 1.16-.57 1.68-.97l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.62Z"/></svg>
  </button>
</header>

<main id="main">

  <!-- ── ÜBERSICHT ───────────────────────────────────────────── -->
  <section class="view" id="view-home">
    <div class="hero">
      <div class="hero-label">Gesamtbankroll</div>
      <div class="hero-value" id="totalBankroll">0 €</div>
      <div class="hero-sub" id="totalSub">—</div>
    </div>

    <div class="roll-grid" id="rollGrid"></div>

    <div class="card">
      <div class="card-head">
        <h2>Verlauf</h2>
        <div class="seg" id="chartSeg">
          <button data-k="all" class="on">Gesamt</button>
          <button data-k="cash">Cash</button>
          <button data-k="mtt">Turnier</button>
          <button data-k="casino">Casino</button>
        </div>
      </div>
      <div id="chart" class="chart"></div>
      <div class="chart-legend" id="chartLegend"></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Letzte Sessions</h2>
        <button class="link" data-nav="sessions">Alle</button></div>
      <div id="recentList" class="list"></div>
    </div>
  </section>

  <!-- ── SESSIONS ────────────────────────────────────────────── -->
  <section class="view hidden" id="view-sessions">
    <div class="seg wide" id="filterSeg">
      <button data-k="all" class="on">Alle</button>
      <button data-k="cash">Cash</button>
      <button data-k="mtt">Turnier</button>
      <button data-k="casino">Casino</button>
    </div>
    <div id="sessionList" class="list list-full"></div>
  </section>

  <!-- ── STATISTIK ───────────────────────────────────────────── -->
  <section class="view hidden" id="view-stats">
    <div class="seg wide" id="statSeg">
      <button data-k="all" class="on">Gesamt</button>
      <button data-k="cash">Cash</button>
      <button data-k="mtt">Turnier</button>
      <button data-k="casino">Casino</button>
    </div>
    <div id="statBody"></div>
  </section>

  <!-- ── EV / EQUITY ─────────────────────────────────────────── -->
  <section class="view hidden" id="view-ev">
    <div class="card">
      <div class="card-head"><h2>Equity-Rechner</h2>
        <button class="link" id="evClear">Zurücksetzen</button></div>

      <div class="ev-row">
        <div class="ev-label">Deine Hand</div>
        <div class="slots" data-group="hero">
          <button class="slot" data-slot="h0"></button>
          <button class="slot" data-slot="h1"></button>
        </div>
        <div class="ev-eq" id="eqHero">–</div>
      </div>

      <div class="ev-vs">vs.</div>

      <div class="ev-row">
        <div class="ev-label">Gegner</div>
        <div class="slots" data-group="villain">
          <button class="slot" data-slot="v0"></button>
          <button class="slot" data-slot="v1"></button>
        </div>
        <div class="ev-eq" id="eqVill">–</div>
      </div>

      <div class="ev-board">
        <div class="ev-label">Board <span class="muted">(optional)</span></div>
        <div class="slots">
          <button class="slot" data-slot="b0"></button>
          <button class="slot" data-slot="b1"></button>
          <button class="slot" data-slot="b2"></button>
          <span class="gap"></span>
          <button class="slot" data-slot="b3"></button>
          <span class="gap"></span>
          <button class="slot" data-slot="b4"></button>
        </div>
      </div>

      <div class="eqbar" id="eqBar">
        <div class="eqbar-h" style="width:0%"></div>
        <div class="eqbar-t" style="width:0%"></div>
      </div>
      <div class="eqmeta" id="eqMeta">Wähle vier Karten aus.</div>

      <button class="btn btn-primary btn-block" id="evCalc" disabled>Berechnen</button>
      <div class="progress hidden" id="evProgress"><div></div></div>
      <div id="evDetail" class="ev-detail"></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Pot Odds</h2></div>
      <div class="form-grid two">
        <label>Pot (vor Einsatz)<input type="number" inputmode="decimal" id="poPot" placeholder="100"></label>
        <label>Zu callen<input type="number" inputmode="decimal" id="poBet" placeholder="50"></label>
      </div>
      <div class="podds" id="poOut">Benötigte Equity: <b>–</b></div>
    </div>
  </section>

</main>

<!-- ── TABBAR ──────────────────────────────────────────────── -->
<nav class="tabbar">
  <button data-nav="home" class="on">
    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3 3 10.5V21h6v-6h6v6h6V10.5Z"/></svg><span>Übersicht</span></button>
  <button data-nav="sessions">
    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 5h16v2H4Zm0 6h16v2H4Zm0 6h16v2H4Z"/></svg><span>Sessions</span></button>
  <button id="btnNew" class="fab-tab" aria-label="Neue Session">
    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6Z"/></svg></button>
  <button data-nav="stats">
    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 19h16v2H4Zm2-6h3v5H6Zm5-6h3v11h-3Zm5-4h3v15h-3Z"/></svg><span>Statistik</span></button>
  <button data-nav="ev">
    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Zm1 3v3h10V5Zm0 6v2h3v-2Zm5 0v2h3v-2Zm-5 4v2h3v-2Zm5 0v2h3v-2Z"/></svg><span>EV</span></button>
</nav>

<!-- ── SHEET (Formulare & Dialoge) ─────────────────────────── -->
<div class="scrim hidden" id="scrim"></div>
<div class="sheet hidden" id="sheet">
  <div class="sheet-grip"></div>
  <div class="sheet-head">
    <button class="link" id="sheetCancel">Abbrechen</button>
    <strong id="sheetTitle">Neue Session</strong>
    <button class="link strong" id="sheetSave">Sichern</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<!-- ── KARTENWÄHLER ───────────────────────────────────────── -->
<div class="scrim hidden" id="cardScrim"></div>
<div class="cardpicker hidden" id="cardPicker">
  <div class="sheet-grip"></div>
  <div class="sheet-head">
    <button class="link" id="cpClear">Leeren</button>
    <strong id="cpTitle">Karte wählen</strong>
    <button class="link strong" id="cpClose">Fertig</button>
  </div>
  <div class="cp-grid" id="cpGrid"></div>
</div>

<div class="toast hidden" id="toast"></div>

<script src="equity.js"></script>
<script src="app.js"></script>
</body>
</html>
